[package]
name = "sc-memory"
version = { workspace = true }
edition = "2024"
license = { workspace = true }
repository = { workspace = true }
description = "Persistent local memory core (embeddings, storage, retrieval) for SC Node"
categories = { workspace = true }
keywords = { workspace = true }

[features]
default = []
# Optional TurboVec-accelerated ANN backend. OFF by default: the default
# build never links or calls into `turbovec`. See src/turbovec_backend.rs
# for the upstream-API verification note.
turbovec = ["dep:turbovec"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }

# Optional, feature-gated ANN backend, pinned to tested TurboVec 1.1.2.
# Keep off by default. The runtime does not construct sc-memory yet.
# This optional upstream feature requires Rust 1.89+, while default SC Node needs 1.85+.
turbovec = { version = "=1.1.2", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
